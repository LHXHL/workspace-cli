version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: ../gen
    opt:
      - paths=source_relative
      - Magentcompose/v2/agentcompose.proto=github.com/chaitin/chaitin-cli/products/agentcompose/gen/agentcompose/v2
      - Mhealth/v1/health.proto=github.com/chaitin/chaitin-cli/products/agentcompose/gen/health/v1
  - local: [go, tool, protoc-gen-connect-go]
    out: ../gen
    opt:
      - paths=source_relative
      - Magentcompose/v2/agentcompose.proto=github.com/chaitin/chaitin-cli/products/agentcompose/gen/agentcompose/v2
      - Mhealth/v1/health.proto=github.com/chaitin/chaitin-cli/products/agentcompose/gen/health/v1
